name: Scrape COTA Notices

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'scrape.php'
      - 'tests/**'
      - 'composer.*'
      - 'reroutes.schema.json'
      - '.github/workflows/scrape.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scrape.php'
      - 'tests/**'
      - 'composer.*'
      - 'reroutes.schema.json'
      - '.github/workflows/scrape.yml'

permissions:
  contents: read

concurrency:
  group: cota-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer run test

  scrape:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress
      - run: composer run scrape
      - name: Commit Updated Notices
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/feed.xml
          if git diff --cached --quiet; then
            echo "No notice changes."
            exit 0
          fi
          git commit -m "Update COTA notices"
          git push origin "HEAD:$DEFAULT_BRANCH"
